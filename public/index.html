<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Mika · Get started</title><link rel="stylesheet" href="/styles.css" /></head>
<body><main class="shell onboarding-shell">
  <header><div class="mark">m</div><span>Mika</span><span class="quiet">AI receptionist</span></header>
  <section class="intro compact-intro"><p class="eyebrow">For salon owners</p><h1>Let Mika learn your salon.</h1><p class="lede">Start with your website. Then connect your calendar so Mika can take the first call.</p></section>
  <section class="panel onboarding-panel">
    <div class="step-label"><span>01</span><span>Salon website</span></div>
    <label for="website">Your salon website</label>
    <div class="row form-row"><input id="website" type="url" placeholder="https://your-salon.com" autocomplete="url" /><button id="import">Continue</button></div>
    <div class="learning" id="learning" hidden><span class="learning-dot"></span><span id="profileMessage">Learning about your salon…</span></div>
    <div class="next-step" id="calendarStep" hidden><div><div class="step-label"><span>02</span><span>Salon calendar</span></div><p class="small">Connect Google Calendar so Mika can see real openings.</p></div><a class="button" href="/api/google/connect">Connect calendar</a></div>
  </section>
</main><script>
const website = document.querySelector('#website'); const importButton = document.querySelector('#import'); const learning = document.querySelector('#learning'); const calendarStep = document.querySelector('#calendarStep');
importButton.onclick = async () => { const value = website.value.trim(); if (!/^https?:\/\//i.test(value)) { document.querySelector('#profileMessage').textContent = 'Paste a full website URL to continue.'; learning.hidden = false; return; } importButton.disabled = true; learning.hidden = false; document.querySelector('#profileMessage').textContent = 'Learning about your salon…'; const res = await fetch('/api/profile/import', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({website:value}) }); const data = await res.json().catch(()=>({})); if (!res.ok) { document.querySelector('#profileMessage').textContent = data.error || 'I could not read that site.'; importButton.disabled = false; return; } document.querySelector('#profileMessage').textContent = 'I learned about your salon.'; calendarStep.hidden = false; };
</script></body></html>
